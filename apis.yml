name: black-unique
description: >-
  Black Unique (全球购骑士特权, "Global Shopping Knight Privilege") is a membership-based
  consumer e-commerce and discounts platform founded in 2018 and headquartered in
  Guangzhou, China. Its core product is a privileges/membership card that aggregates
  discounts and special offers across a wide range of consumer categories: online
  shopping on major marketplaces such as Tmall, JD.com and Kaola, in-person shopping
  at international duty-free shops, outlets and supermarkets across 24-plus countries,
  plus dining, entertainment, travel and fuel. The company operates a consumer-facing
  app and website rather than a public developer program, and is backed by Qiming
  Venture Partners along with CCV, Eastern Bell Venture Capital and INCE Capital. It
  was added to the API Evangelist network as a Qiming portfolio lead; enrichment found
  no public API, developer portal, SDK, or other developer surface.
